<div class="login-container">
  <div class="glass-card fade-in">
    <div class="card-header">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ff7e47" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="restaurant-icon">
          <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
      </div>
      <h2>North Chicken</h2>
      <p>Inicia sesión para gestionar el restaurante</p>
    </div>

    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="auth-form">
      <div class="input-group">
        <input 
          type="text" 
          id="nombre" 
          name="nombre" 
          [(ngModel)]="nombre" 
          required 
          #nombreInput="ngModel"
          placeholder=" " 
          autocomplete="username">
        <label for="nombre">Nombre de Usuario</label>
        <div class="validation-error" *ngIf="nombreInput.invalid && nombreInput.touched">
          El nombre de usuario es obligatorio
        </div>
      </div>

      <div class="input-group">
        <input 
          type="password" 
          id="password" 
          name="password" 
          [(ngModel)]="password" 
          required 
          #passwordInput="ngModel"
          placeholder=" ">
        <label for="password">Contraseña</label>
        <div class="validation-error" *ngIf="passwordInput.invalid && passwordInput.touched">
          La contraseña es obligatoria
        </div>
      </div>

      <div class="alert-message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="alert-message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-primary">
        <span *ngIf="!isLoading">Iniciar Sesión</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="card-footer">
      <p>¿No tienes cuenta? <a routerLink="/register">Regístrate aquí</a></p>
    </div>
  </div>
</div>
