<div class="login-container">
  <div class="glass-card wide-card fade-in">
    <div class="card-header">
      <div class="logo-badge">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ff7e47" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="restaurant-icon">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </svg>
      </div>
      <h2>Registro de Personal</h2>
      <p>Crea una cuenta para ingresar al personal del restaurante</p>
    </div>

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="auth-form multi-row-form">
      <div class="form-row">
        <div class="input-group">
          <input type="text" id="nombre" name="nombre" [(ngModel)]="user.nombre" required #nombreInput="ngModel"
            placeholder=" ">
          <label for="nombre">Nombre</label>
          <div class="validation-error" *ngIf="nombreInput.invalid && nombreInput.touched">
            El nombre es obligatorio
          </div>
        </div>

        <div class="input-group">
          <input type="text" id="apellido" name="apellido" [(ngModel)]="user.apellido" required #apellidoInput="ngModel"
            placeholder=" ">
          <label for="apellido">Apellido</label>
          <div class="validation-error" *ngIf="apellidoInput.invalid && apellidoInput.touched">
            El apellido es obligatorio
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="input-group">
          <input type="email" id="email" name="email" [(ngModel)]="user.email" #emailInput="ngModel" placeholder=" ">
          <label for="email">Correo Electrónico (Opcional)</label>
          <div class="validation-error" *ngIf="emailInput.invalid && emailInput.touched && user.email">
            Introduce un correo válido
          </div>
        </div>

        <div class="input-group">
          <input type="password" id="password" name="password" [(ngModel)]="user.password" required
            #passwordInput="ngModel" placeholder=" ">
          <label for="password">Contraseña</label>
          <div class="validation-error" *ngIf="passwordInput.invalid && passwordInput.touched">
            La contraseña es obligatoria
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="input-group">
          <input type="text" id="telefono" name="telefono" [(ngModel)]="user.telefono" placeholder=" ">
          <label for="telefono">Teléfono (Opcional)</label>
        </div>

        <div class="input-group select-group">
          <select id="rolId" name="rolId" [(ngModel)]="user.rolId" required>
            <option *ngFor="let rol of roles" [value]="rol.id">{{ rol.nombre }}</option>
          </select>
          <label for="rolId" class="select-label">Rol del Personal</label>
        </div>
      </div>

      <div class="form-row">
        <div class="input-group select-group full-width">
          <select id="sucursalId" name="sucursalId" [(ngModel)]="user.sucursalId" required>
            <option *ngFor="let suc of sucursales" [value]="suc.id">{{ suc.nombre }}</option>
          </select>
          <label for="sucursalId" class="select-label">Sucursal de Trabajo</label>
        </div>
      </div>

      <div class="alert-message error" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <div class="alert-message success" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <button type="submit" [disabled]="registerForm.invalid || isLoading" class="btn-primary">
        <span *ngIf="!isLoading">Registrar Usuario</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>
    </form>

    <div class="card-footer">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
    </div>
  </div>
</div>
